services:
  web:
    build: .
    command: gunicorn registry_main.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:49152:8000"
    environment:
      - DEBUG=${DEBUG:-True}
    env_file:
      - .env
volumes:
  postgres_data_dev:
  static_volume:
  media_volume:
