<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .header { background-color: #f8fafc; padding: 15px; border-radius: 6px 6px 0 0; border-bottom: 1px solid #e2e8f0; }
        .content { padding: 20px 0; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Înregistrare utilizator nou</h3>
        </div>
        <div class="content">
            <p>Un nou utilizator s-a înregistrat în sistem și așteaptă aprobare:</p>
            <ul>
                <li><strong>Nume de utilizator:</strong> {{ user.username }}</li>
                <li><strong>Email:</strong> {{ user.email }}</li>
                <li><strong>Nume și prenume:</strong> {{ user.firstname }} {{ user.lastname }}</li>
                <li><strong>Funcție:</strong> {{ user.jobtitle }}</li>
            </ul>
            <p style="margin-top: 30px;">
                <a href="{{ admin_url }}" class="btn">Accesează panoul de administrare</a>
            </p>
        </div>
    </div>
</body>
</html>
