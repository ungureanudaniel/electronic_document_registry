<aside class="w-64 bg-slate-900 border-r border-slate-800 text-slate-300 flex flex-col shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-slate-800">
        <h1 class="font-bold text-white tracking-wide text-base">Registrul de corespondență al APN Bucegi</h1>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'dashboard' %}bg-slate-800 text-white{% else %}text-slate-400 hover:bg-slate-800{% endif %}">Dashboard</a>
        <a href="{% url 'document_list' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'dashboard' %}bg-slate-800 text-white{% else %}text-slate-400 hover:bg-slate-800{% endif %}">Registru de corespondență</a>
        <a href="{% url 'userlist' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'dashboard' %}bg-slate-800 text-white{% else %}text-slate-400 hover:bg-slate-800{% endif %}">Management utilizatori</a>
        
    </nav>
    <div class="p-4 border-t border-slate-800 bg-slate-950/50">
        {% if request.user.is_authenticated %}
            <div class="mb-3 px-2">
                <p class="text-xs text-slate-400">Signed in as</p>
                <p class="text-sm font-medium text-white truncate">{{ request.user.email }}</p>
            </div>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="w-full flex items-center justify-center bg-red-600/10 text-red-400 hover:bg-red-600 hover:text-white text-sm font-medium py-2 px-4 rounded-lg transition">
                    Sign Out
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="w-full flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition">
                Sign In
            </a>
        {% endif %}
    </div>
</aside>
