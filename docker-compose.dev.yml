services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
    env_file:
      - .env
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles/
      - media_volume:/app/media/
    depends_on:
      - web
  db:
    image: postgres:16-alpine
    container_name: registry_postgres
    restart: always
    environment:
      POSTGRES_DB: registry_db
      POSTGRES_USER: daniel
      POSTGRES_PASSWORD: bucegi23#
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  static_volume:
  media_volume:
networks:
  app-net:
    driver: bridge
