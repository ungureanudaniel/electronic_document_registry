services:
  web:
    build: .
    command: gunicorn registry_main.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles/
      - media_volume:/app/media/
    depends_on:
      - web
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
  static_volume:
  media_volume:
